<!-- AGENCY: Creative Media video hero (from guanzi) -->
<section
  class="home-hero"
  id="creativeHero"
  data-home-block="creativeHero"
  data-compose-unit="creative-hero"
>
  <div class="home-hero-media">
    <video
      muted
      autoplay
      loop
      playsinline
      preload="metadata"
      id="homeVideo"
      disablePictureInPicture
    >
      <source data-bind="pages.home.video" src="/videos/home-hero.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="home-hero-content">
    <h2 class="home-title" data-bind="pages.home.videoHeroTitle">Creative Media</h2>
    <p class="home-subtitle" data-bind="pages.home.videoHeroSubtitle">以光为媒，让品牌故事被看见、被记住</p>
  </div>
  <button type="button" class="home-sound-toggle is-muted" id="homeSoundToggle" aria-pressed="false" aria-label="开启声音">
    <span class="home-sound-orb" aria-hidden="true">
      <span class="home-sound-icon">
        <svg class="icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 9.5v5h3.2L12 18V6L7.2 9.5H4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 9.5v5h3.2L12 18V6L7.2 9.5H4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M15.2 9.8l4 4.4M19.2 9.8l-4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
    </span>
    <span class="home-sound-copy">
      <span class="home-sound-kicker">Sound</span>
      <span class="home-sound-label">Off</span>
    </span>
  </button>
</section>

<!-- AGENCY: 合作客户 / 合作伙伴 -->
<section
  class="home-section home-clients-section"
  id="homeClients"
  data-home-block="clients"
  data-compose-unit="home-clients"
>
  <div class="home-clients-bg" aria-hidden="true"></div>
  <div class="home-wrap home-clients-inner">
    <div class="home-clients-head reveal">
      <div class="home-clients-heading">
        <p class="home-clients-eyebrow" data-bind="pages.home.clientsTitleEn">COOPERATIVE CLIENTS.</p>
        <h2 class="home-clients-title" data-bind="pages.home.clientsTitle">合作客户</h2>
      </div>
      <div class="home-clients-note">
        <span class="home-clients-brand" data-bind="pages.home.clientsBrandMark">品牌矩阵</span>
        <span class="home-clients-rank" data-bind="pages.home.clientsRankNote">排名不分先后</span>
      </div>
    </div>
    <div class="home-clients-groups reveal" data-list="pages.home.clientsGroups"></div>
  </div>
</section>

<!-- AGENCY: 核心团队架构 -->
<section
  class="about-team"
  id="aboutTeam"
  data-home-block="team"
  data-compose-unit="about-team"
>
  <div class="about-team-inner">
    <header class="about-team-head reveal">
      <span class="about-team-icon" aria-hidden="true"></span>
      <h2 class="about-team-title">
        <span data-bind="pages.about.teamTitle">核心团队架构</span>
        <em data-bind="pages.about.teamTitleEn">CORE TEAM STRUCTURE.</em>
      </h2>
    </header>
    <div class="about-team-grid reveal" data-list="pages.about.teamMembers"></div>
  </div>
</section>
